<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-[#0b0c10] text-gray-300 min-h-screen flex items-center justify-center">
    <div class="text-center bg-[#1f2833] p-10 rounded-lg shadow-lg border border-gray-800 max-w-md w-full">
        <h1 class="text-6xl font-bold text-[#118DFF] mb-4">404</h1>
        <h2 class="text-2xl font-semibold text-white mb-2">Page Not Found</h2>
        <p class="text-gray-400 mb-8">The requested endpoint does not exist on this server.</p>
        <a href="/dashboard" class="bg-[#118DFF] hover:bg-[#0d6bcc] text-white font-medium py-2 px-6 rounded transition">
            Return to Dashboard
        </a>
    </div>
</body>
</html>
